name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# uv runs only the CPython build its pinned release names, never one the runner image ships.
env:
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
          enable-cache: true
      - run: bash scripts/check.sh
