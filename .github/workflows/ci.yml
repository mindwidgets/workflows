name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# uv runs only the CPython build its pinned release names, never one the runner image ships.
env:
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
          enable-cache: true
      - run: bash scripts/check.sh
