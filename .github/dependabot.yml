# Minor and patch updates arrive grouped, one PR per ecosystem; each major arrives in its own PR.
# Dependabot never reads values under `with:`, such as setup-uv's uv `version:` and `checksum:`:
# bump those by hand (README.md, "Bumping uv").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uvv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      uv-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pre-commit-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
