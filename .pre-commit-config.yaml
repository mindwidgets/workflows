repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  # GitHub validates .github/dependabot.yml only once it reaches main, where a broken
  # config silently stops Dependabot; this catches it in PR CI. The schema is built in.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-dependabot
  - repo: local
    hooks:
      # ruff runs from the uv environment, so commits, check.sh and CI use the version in uv.lock.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        description: Type-check every Python file, as configured in pyproject.toml.
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
